<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能表情包管理</title><link rel="stylesheet" href="style.css?v=20260902-sticky1"></head>
<body><div class="shell">
<header class="hero"><div><p class="eyebrow">ASTRBOT PLUGIN</p><h1>智能表情包</h1><p class="subtitle">管理图片、情绪标签与每张图片独立的内容描述。</p></div><div class="hero-mark">✦</div></header>
<section class="stats"><div class="stat"><span>图库图片</span><strong id="stat-total">—</strong></div><div class="stat"><span>已启用</span><strong id="stat-enabled">—</strong></div><div class="stat"><span>情绪标签</span><strong id="stat-emotions">—</strong></div><div class="stat"><span>内容描述</span><strong id="stat-content">—</strong></div></section>
<div id="toast" class="toast" role="status"></div><div id="boot-error" class="boot-error" hidden></div><div id="confirm-modal" class="confirm-modal" hidden><div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title"><h3 id="confirm-modal-title">请确认</h3><p id="confirm-modal-message"></p><input id="confirm-modal-input" hidden maxlength="40"><div class="confirm-actions"><button type="button" class="ghost" id="confirm-modal-cancel">取消</button><button type="button" class="danger" id="confirm-modal-ok">确认</button></div></div></div>
<section class="grid-top"><div class="panel upload-panel"><div class="panel-head"><div><p class="kicker">图库入口</p><h2>上传新表情</h2></div><span class="pill">单张 · ≤ 10 MB</span></div>
<label class="dropzone"><input id="file" type="file" accept=".jpg,.jpeg,.png,.webp,.gif"><span class="upload-icon">＋</span><b>选择一张图片</b><small>支持 JPG、JPEG、PNG、WEBP、GIF</small></label><div id="preview"></div>
<div class="field"><label for="upload-description">内容描述 <small>只属于这张图片</small></label><input id="upload-description" maxlength="200" placeholder="例如：猫咪无奈地看着镜头"></div>
<div class="tag-picker"><div class="picker-title">情绪标签 <small>支持搜索，可多选</small></div><div class="tag-select" data-tag-select="upload"><button type="button" class="tag-select-trigger" data-tag-trigger="upload">选择情绪标签</button><div class="tag-select-menu" data-tag-menu="upload"><input class="tag-search" data-tag-search="upload" placeholder="搜索情绪标签…"><div id="emotion-options" class="tag-options"></div></div></div><div id="content-tags" hidden></div></div>
<div class="action-row"><button class="primary" id="upload">确认上传</button><span id="message" class="inline-message"></span></div></div>
<div class="panel tags-panel"><div class="panel-head"><div><p class="kicker">情绪标签库</p><h2>管理标签</h2></div><span id="tag-count" class="muted"></span></div><div class="tag-create"><input id="tag-name" placeholder="输入新情绪标签" maxlength="40"><button class="secondary" id="add-tag">新增</button></div><div id="tag-message" class="form-message"></div><div id="tags" class="tag-list"></div></div></section>
<section class="panel library-panel"><div class="panel-head library-head"><div><p class="kicker">内容管理</p><h2>图库</h2></div><button class="ghost" id="refresh">↻ 刷新</button></div><div class="library-controls-sticky"><div class="filters"><div class="search-box"><span>⌕</span><input id="filename" placeholder="搜索原始文件名"></div><select id="enabled"><option value="">全部状态</option><option value="1">仅启用</option><option value="0">仅禁用</option></select><div class="filter-tag-select" id="emotion-filter"><button type="button" class="filter-tag-trigger" id="emotion-trigger">全部情绪</button><div class="filter-tag-menu"><input id="emotion-filter-search" placeholder="搜索情绪标签…"><div id="emotion-filter-options" class="filter-tag-options"></div></div></div><select id="emotion" hidden><option value="">全部情绪</option></select><input id="content" placeholder="搜索内容描述"><button class="secondary" id="search">筛选</button><button class="ghost" id="reset">重置</button></div><div class="bulk-toolbar"><label><input type="checkbox" id="select-all"> 全选当前结果</label><span id="selected-count">已选 0 张</span><div class="bulk-actions"><button type="button" class="secondary" id="bulk-enable" disabled>启用选中</button><button type="button" class="secondary" id="bulk-disable" disabled>禁用选中</button><button type="button" class="danger" id="bulk-delete" disabled>删除选中</button></div></div></div><div id="images" class="image-grid"><div class="empty">正在加载图库…</div></div></section>
</div><script type="module" src="./app.js?v=20260902-sticky1"></script></body></html>
